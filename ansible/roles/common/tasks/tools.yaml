---
- name: Install system utilities
  ansible.builtin.dnf:
    name:
      - vim
      - nano
      - screen
      - tmux
      - net-tools
      - bind-utils
      - htop
      - git
      - wget
      - unzip
      - nfs-utils       
    state: latest
  become: true          

- name: Install Python 3 development tools
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
      - python3-pip
      - python3-virtualenv
    state: latest
  become: true

- name: Install compilers and build tools
  ansible.builtin.dnf:
    name:
      - gcc
      - gcc-c++
      - gfortran
      - make
      - patch
      - bzip2
    state: latest
  become: true
