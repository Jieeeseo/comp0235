---
# 1. 安装 Celery 库，这样 Host 才能运行 Python 脚本发送任务
- name: Install Celery via pip
  pip:
    name: 
      - celery
      - biopython
    executable: pip3
  become: true

# 2. 创建存放代码的目录 (保持和 Worker 一致，方便管理)
- name: Create application directory
  file:
    path: /opt/calc_engine
    state: directory
    mode: '0755'
  become: true

- name: Deploy application code to Host
  copy:
    src: "{{ item }}"
    dest: /opt/calc_engine/
    mode: '0644'
  with_items:
    - celery_app.py      # 配置
    - dispatcher.py      # 任务分发器
    - collator.py        # 结果汇总器
    - experiment_ids.txt # 输入 ID 列表
  become: true
